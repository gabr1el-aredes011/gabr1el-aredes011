<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Aredes — Desenvolvedor Full Stack em formação</title>
  <desc id="desc">Banner profissional em tons de azul com elementos inspirados em código e tecnologia.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050B18"/>
      <stop offset="0.52" stop-color="#071B35"/>
      <stop offset="1" stop-color="#0A2D52"/>
    </linearGradient>
    <linearGradient id="accent" x1="260" y1="55" x2="920" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#2587F5"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(920 92) rotate(143) scale(405 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2587F5" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2587F5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#60A5FA" stroke-opacity="0.07"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="2"/>

  <circle cx="109" cy="62" r="4" fill="#38BDF8"/>
  <circle cx="128" cy="62" r="4" fill="#2587F5"/>
  <circle cx="147" cy="62" r="4" fill="#1D4ED8"/>
  <path d="M90 86H1110" stroke="#60A5FA" stroke-opacity="0.16"/>

  <g opacity="0.9">
    <path d="M170 121L122 150L170 179" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1030 121L1078 150L1030 179" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1006 112L975 188" stroke="#2587F5" stroke-width="7" stroke-linecap="round"/>
  </g>

  <path d="M302 209H898" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="302" cy="209" r="4" fill="#38BDF8"/>
  <circle cx="898" cy="209" r="4" fill="#1D4ED8"/>

  <text x="600" y="154" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="750" letter-spacing="5">GABRIEL AREDES</text>
  <text x="600" y="192" text-anchor="middle" fill="#7DD3FC" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="3">FULL STACK DEVELOPER • ADS STUDENT</text>
  <text x="600" y="243" text-anchor="middle" fill="#A5B4C8" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="2">BACK-END  /  WEB  /  APIs  /  DATABASES</text>

  <circle cx="600" cy="150" r="105" fill="#2587F5" fill-opacity="0.06" filter="url(#softGlow)"/>
</svg>
